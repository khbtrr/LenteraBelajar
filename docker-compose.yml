services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lenterabelajar?schema=public
      - NEXTAUTH_SECRET=change-this-in-production
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=change-this-in-production
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE_MB=50
      - NEXT_PUBLIC_APP_NAME=LenteraBelajar
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lenterabelajar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
